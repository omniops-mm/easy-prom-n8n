# Queue-mode demo: n8n split into a main process and a worker, plus the
# Postgres and Redis queue mode requires. Used together with compose.yaml:
#
#   docker compose -f compose.yaml -f compose.demo-queue.yaml --profile queue up -d
#
# In queue mode the metrics split across the processes: the main carries queue
# depth gauges, workflow counters and the duration histogram (even for
# executions a worker ran); the worker carries node-level counters and its own
# process health. Scrape both: copy prometheus/targets/queue.yml.example.
#
# Separate instance and database from the single-container demo profile.
# Queue mode requires Postgres; SQLite cannot be shared between processes.

# shared by main and worker: same database, same Redis, and the same
# encryption key, or the worker cannot decrypt credentials
x-n8n-queue-env: &n8n-queue-env
  EXECUTIONS_MODE: queue
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "${POSTGRES_DB:-n8n}"
  DB_POSTGRESDB_USER: "${POSTGRES_USER:-n8n}"
  DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env, see .env.example}"

services:
  postgres:
    image: postgres:17.10-alpine
    profiles: ["queue"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-n8n}"
      POSTGRES_USER: "${POSTGRES_USER:-n8n}"
      # no default; an empty password leaves the database open to the network
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  redis:
    image: redis:7.4.10-alpine
    profiles: ["queue"]
    # no requirepass: publishes no port, shared only with the two n8n
    # processes. A Redis used beyond this demo needs a password.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  n8n-main:
    image: docker.n8n.io/n8nio/n8n:2.35.1
    profiles: ["queue"]
    # same metrics preset as the single-container demo
    env_file:
      - ./demo/n8n.env
    environment:
      <<: *n8n-queue-env
    volumes:
      - n8n_main_data:/home/node/.n8n
    # not published; holds the encryption key and DB password, and /metrics
    # has no auth. Uncomment for the editor UI from this machine only:
    # ports:
    #   - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # readiness includes DB connection + migrations, which the worker waits on
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:2.35.1
    profiles: ["queue"]
    command: ["worker"]
    env_file:
      - ./demo/n8n.env
    environment:
      <<: *n8n-queue-env
      # adds /healthz* to the worker (404 without it); needed only for the
      # healthcheck below - /metrics is served from N8N_METRICS=true alone.
      # QUEUE_HEALTH_CHECK_PORT stays unset: it moves the whole HTTP server,
      # /metrics included, off 5678 and would take the scrape target with it.
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # the main owns the schema migrations; a worker starting first can crash
      # on a half-migrated database
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

volumes:
  postgres_data:
  redis_data:
  n8n_main_data:
