# Optional logs profile: Loki for storage, Vector for collection.
#
#   COMPOSE_PROFILES=logs docker compose -f compose.yaml -f compose.logs.yaml up -d
#
# SECURITY: this hands Vector the Docker socket, which is the daemon's full
# control API. Anything holding it can read every container's environment on
# this host, passwords included. The :ro mount protects the socket file, not
# the API behind it. That is why the profile is opt-in. A socket proxy in
# front of the daemon removes the exposure.
#
# Vector asks the Docker daemon for logs, so an n8n installed with npm, under
# systemd, or on another host is invisible here.

services:
  loki:
    image: grafana/loki:3.7.6
    profiles: ["logs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # no healthcheck: the image is distroless, so there is no shell or HTTP
    # client to probe with. Vector and Grafana both retry a Loki that is slow
    # to come up.
    security_opt:
      - no-new-privileges:true
    networks:
      epn8n:

  vector:
    image: timberio/vector:0.57.0-alpine
    profiles: ["logs"]
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # 127.0.0.1, not localhost: localhost is IPv6-only in this image while
      # the exporter binds IPv4, so a localhost check is refused forever.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9598/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      epn8n:

volumes:
  loki-data:
  vector-data:
