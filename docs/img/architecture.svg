<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="ti de">
<title id="ti">Architecture</title>
<desc id="de">Prometheus scrapes the metrics endpoint of your existing n8n, and Grafana queries Prometheus. The optional logs profile adds Vector, which reads container logs and ships them to Loki; Grafana queries Loki and Prometheus scrapes Vector's derived counters.</desc>
<style>
text{font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:17px;font-weight:650;fill:#FFFFFF;text-anchor:middle}
.l{font-size:11.5px;fill:#AEB4BE;text-anchor:middle}
.tag{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:#949AA4}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 1.5L9 5L0 8.5z" fill="#C6CCD6"/></marker>
</defs>

<rect width="900" height="370" rx="14" fill="#040506"/>

<!-- metrics lane -->
<rect x="40"  y="70" width="190" height="80" rx="10" fill="#101114" stroke="#EA4B71" stroke-width="2"/>
<text class="t" x="135" y="110">your n8n</text>

<rect x="355" y="70" width="190" height="80" rx="10" fill="#101114" stroke="#646B78" stroke-width="2"/>
<text class="t" x="450" y="110">Prometheus</text>

<rect x="670" y="70" width="190" height="80" rx="10" fill="#101114" stroke="#646B78" stroke-width="2"/>
<text class="t" x="765" y="110">Grafana</text>

<line x1="347" y1="110" x2="238" y2="110" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="292" y="94">GET /metrics</text>

<line x1="662" y1="110" x2="553" y2="110" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="607" y="94">PromQL</text>

<!-- logs lane, optional -->
<text class="tag" x="170" y="228">OPTIONAL &#183; LOGS PROFILE</text>

<rect x="355" y="250" width="190" height="80" rx="10" fill="#101114" stroke="#646B78" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="450" y="290">Vector</text>

<rect x="670" y="250" width="190" height="80" rx="10" fill="#101114" stroke="#646B78" stroke-width="2" stroke-dasharray="6 5"/>
<text class="t" x="765" y="290">Loki</text>

<path d="M135 150 V290 H347" fill="none" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="241" y="274">container logs</text>

<line x1="553" y1="290" x2="662" y2="290" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="607" y="274">log lines</text>

<line x1="450" y1="158" x2="450" y2="242" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="502" y="196">GET /metrics</text>

<line x1="765" y1="158" x2="765" y2="242" stroke="#C6CCD6" stroke-width="2" marker-end="url(#ar)"/>
<text class="l" x="800" y="196">LogQL</text>
</svg>
