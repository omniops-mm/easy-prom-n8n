# For an n8n running in its own compose project on this machine.
#
#   docker compose -f compose.yaml -f compose.external-network.yaml up -d
#
# Joins Prometheus, and only Prometheus, to the network that project created,
# so it can resolve the n8n container by service name.
#
# Two names to find first:
#   1. The network. Usually <their-directory>_default; docker network ls shows
#      it. Put it in N8N_NETWORK in .env. A wrong name fails at start with
#      "network ... declared as external, but could not be found".
#   2. Their n8n service name. Put it in prometheus/targets/n8n.yml.

services:
  prometheus:
    networks:
      n8n_external:

networks:
  n8n_external:
    name: ${N8N_NETWORK:-n8n_default}
    external: true
