# Prometheus + Grafana for an existing n8n. See INSTALL.md.
# The name "n8n" is not resolved here; each connection mode (demo, host,
# external network) adds its own resolution mechanism.

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      # enables POST /-/reload
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # not published: the API and UI have no authentication. Uncomment for
    # access from this machine:
    # ports:
    #   - "127.0.0.1:9090:9090"
    healthcheck:
      # the image has wget, not curl
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # no default; compose fails to start if unset
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      # disables snapshot uploads to snapshots.raintank.io
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # named volume: Grafana (UID 472) cannot write a host-owned bind mount
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Grafana 13 cold start is ~45s
      start_period: 75s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

volumes:
  prometheus_data:
  grafana_data:

networks:
  epn8n:
    # fixed name, independent of the folder name
    name: easy-prom-n8n
    driver: bridge
