# Prometheus + Grafana for an existing n8n. See README.md.

# Fixed project name, so it does not follow the directory you cloned into.
# vector/vector.yaml filters container logs on this exact value.
name: easy-prom-n8n

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # lets targets/n8n.yml use host.docker.internal for an n8n running on this
    # machine outside Docker. Required on Linux; harmless on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # not published: the API has no authentication. Uncomment to reach it from
    # this machine (useful for debugging a DOWN target).
    # ports:
    #   - "127.0.0.1:9090:9090"
    healthcheck:
      # the image has wget, not curl
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  grafana:
    image: grafana/grafana:13.1.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # no default; compose refuses to start if unset
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run 'cp .env.example .env' first, then set GRAFANA_ADMIN_PASSWORD in it}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # named volume: Grafana (UID 472) cannot write a host-owned bind mount
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Grafana 13 cold start is ~45s
      start_period: 75s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

  # --- demo profile: a throwaway n8n so the dashboards have data ---

  n8n-demo:
    image: docker.n8n.io/n8nio/n8n:2.35.1
    profiles: ["demo"]
    env_file:
      - ./demo/n8n.env
    volumes:
      - n8n_demo_data:/home/node/.n8n
    # no port: scraped over the compose network. Uncomment for the editor UI;
    # the seed container prints the login in its log.
    # ports:
    #   - "127.0.0.1:5678:5678"
    healthcheck:
      # readiness covers DB connection and migrations; /healthz only means the
      # port is open
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      # first start runs DB migrations
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:
        # answers to the name the shipped scrape target uses
        aliases:
          - n8n

  n8n-seed:
    image: docker.n8n.io/n8nio/n8n:2.35.1
    profiles: ["demo"]
    # via sh: the bind-mounted script may lose its executable bit on Windows
    entrypoint: ["/bin/sh", "/demo/seed.sh"]
    volumes:
      - ./demo:/demo:ro
    depends_on:
      n8n-demo:
        condition: service_healthy
    # one-shot; exiting is the success case
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      epn8n:

  loadgen:
    image: curlimages/curl:8.21.0
    profiles: ["demo"]
    entrypoint: ["/bin/sh", "/demo/loadgen.sh"]
    volumes:
      - ./demo:/demo:ro
    depends_on:
      n8n-demo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      epn8n:

volumes:
  prometheus_data:
  grafana_data:
  n8n_demo_data:

networks:
  epn8n:
    # fixed name, independent of the folder name
    name: easy-prom-n8n
    driver: bridge
